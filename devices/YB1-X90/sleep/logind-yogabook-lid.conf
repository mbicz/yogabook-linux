# Yoga Book X90F: yogabook-lid-watch owns sleep from the physical SW_LID switch.
#
# Keep one lid-suspend owner. A delayed logind request was observed starting
# after the lid reopened (2026-10-14, boot ending 05:45). The subsequent hang
# does not establish its cause. The reader arms wakeup_count before requesting sleep.
# SW_LID events are untouched — the hall switch still wakes the machine.
# Revert: rm this file && systemctl kill -s HUP systemd-logind
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
